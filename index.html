<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>互動測驗平台</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang HK",sans-serif;background:#f4f7f6;color:#333;max-width:800px;margin:0 auto;padding:16px;line-height:1.6;font-size:18px}
h1{text-align:center;color:#2c3e50;font-size:24px}
.box{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:monospace}
input[type=text],input[type=number],select{font-size:18px;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;max-width:100%}
.row{margin-bottom:10px}
.row label{display:inline-block;min-width:70px;color:#555}
#scope{width:100%}
#fin{width:100%;margin-bottom:12px}
button{font-size:18px;border:none;border-radius:10px;padding:14px 20px;background:#3498db;color:#fff;cursor:pointer;margin:6px 6px 0 0}
button:disabled{opacity:.5}
button.gray{background:#7f8c8d}
button.green{background:#27ae60}
button.orange{background:#e67e22}
.opt{display:block;width:100%;text-align:left;background:#ecf0f1;color:#222;margin:0 0 10px;padding:16px;min-height:56px;border:2px solid transparent}
.opt.sel{border-color:#3498db;background:#dceefb}
.opt.correct{background:#d4edda;border-color:#28a745}
.opt.wrong{background:#f8d7da;border-color:#dc3545}
.words{margin-bottom:14px}
.w{display:inline-block;background:#ecf0f1;color:#222;margin:0 6px 8px 0;padding:10px 14px;min-height:44px;border:2px solid transparent;border-radius:10px}
.w.sel{border-color:#3498db;background:#dceefb}
.w.correct{background:#d4edda;border-color:#28a745}
.w.wrong{background:#f8d7da;border-color:#dc3545}
.step{font-size:15px;color:#7f8c8d;margin:4px 0 8px}
.q{font-weight:bold;white-space:pre-wrap;margin-bottom:16px}
.exp{display:none;margin-top:14px;padding:14px;background:#e8f4f8;border-left:5px solid #17a2b8;border-radius:4px;white-space:pre-wrap}
.bar{display:flex;justify-content:space-between;color:#7f8c8d;font-weight:bold;margin-bottom:12px}
.err{color:#c0392b;white-space:pre-wrap;font-size:15px;margin-top:10px}
.ok{color:#27ae60;font-size:15px;margin-top:10px}
.tag{display:inline-block;background:#eef;color:#446;border-radius:6px;padding:2px 8px;font-size:13px;margin-right:4px}
.big{font-size:48px;color:#2ecc71;font-weight:bold;text-align:center}
pre{white-space:pre-wrap;background:#f8f9fa;padding:10px;border-radius:8px;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<h1>📝 互動測驗平台</h1>

<div id="setup" class="box">
  <h3 style="margin-top:0">步驟 1:產生 Prompt</h3>
  <div class="row"><label>年級</label>
    <select id="grade"><option>P.1</option><option>P.2</option><option>P.3</option><option>P.4</option><option>P.5</option><option>P.6</option></select></div>
  <div class="row"><label>題型</label>
    <select id="qtype">
      <option value="mcq">選擇題</option>
      <option value="fill">填充題</option>
      <option value="proof">Proofreading(英文)</option>
      <option value="mix">混合題型</option>
    </select></div>
  <div class="row"><label>題數</label><input type="number" id="cnt" value="10" min="1" max="30" style="width:90px"></div>
  <div class="row"><label>範圍</label><input type="text" id="scope" placeholder="例如:英文 Tenses / 數學 分數加減"></div>
  <button class="orange" onclick="copyPrompt()">📋 複製 Prompt(貼去 Gemini)</button>
  <div id="pmsg" class="ok"></div>
  <hr style="margin:20px 0;border:none;border-top:1px solid #eee">
  <h3 style="margin-top:0">步驟 2:貼上 AI 輸出的 JSON</h3>
  <textarea id="src" placeholder="在此貼上題目 JSON"></textarea>
  <button onclick="pasteClip()">📋 貼上</button>
  <button class="green" onclick="startFromInput()">🚀 開始測驗</button>
  <button class="gray" onclick="fillSample()">範例題</button>
  <div id="msg"></div>
  <div id="hist"></div>
</div>

<div id="quiz" class="box hide">
  <div class="bar"><span id="prog"></span><span id="sc"></span></div>
  <div id="tags"></div>
  <div class="q" id="qtext"></div>
  <div id="area"></div>
  <div class="exp" id="exp"></div>
  <button id="next" class="hide" onclick="next()">下一題 ➔</button>
</div>

<div id="result" class="box hide">
  <div class="big" id="final"></div>
  <div id="stats"></div>
  <button class="green" onclick="copyReport()">📤 複製錯題報告</button>
  <button id="retryBtn" onclick="retryWrong()">🔁 只重做錯題</button>
  <button class="gray" onclick="location.reload()">新測驗</button>
  <div id="copymsg" class="ok"></div>
  <pre id="report"></pre>
</div>

<script>
const $=id=>document.getElementById(id);
const L=['A','B','C','D','E','F'];
const TYPES=['mcq','fill','proof'];
let all=[],qs=[],idx=0,score=0,wrongs=[],title='測驗';
let selW=null,selO=null,locked=false;

function show(id){['setup','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function setMsg(t,ok){$('msg').className=ok?'ok':'err';$('msg').textContent=t}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s).normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.。!!]+$/,'')}

/* ---------- Prompt 產生 ---------- */
const SCHEMA={
  mcq:'{"type":"mcq","subject":"科目","topic":"單元","q":"題目","options":["選項1","選項2","選項3","選項4"],"answer":0,"exp":"解釋及解題方法","errorType":"常見錯誤類型"}',
  fill:'{"type":"fill","subject":"科目","topic":"單元","q":"含空位的句子,空位用 ___ 表示","answer":["可接受答案1","可接受答案2"],"exp":"解釋及解題方法","errorType":"常見錯誤類型"}',
  proof:'{"type":"proof","subject":"English","topic":"單元","q":"含一個錯字的完整句子","words":["逐","個","字","拆開"],"errorIndex":0,"options":["正確寫法1","寫法2","寫法3","寫法4"],"answer":0,"exp":"解釋及解題方法","errorType":"常見錯誤類型"}'
};
const RULE={
  mcq:'選擇題(type 為 mcq):answer 是正確選項的位置,0=A、1=B、2=C、3=D;options 要有 4 個。',
  fill:'填充題(type 為 fill):q 內用 ___ 表示空位;answer 是陣列,列出所有可接受的正確答案(例如不同寫法)。',
  proof:'Proofreading(type 為 proof):每題一句,句子內只有一個錯字;words 是把 q 逐個字拆開的陣列(標點跟住前面的字),用空格連起來要等於 q;errorIndex 是錯字在 words 的位置(由 0 起算);options 是該錯字的 4 個替換寫法,answer 是正確寫法的位置(0=A、1=B、2=C、3=D)。'
};
function buildPrompt(){
  const g=$('grade').value,sc=$('scope').value.trim()||'______',n=$('cnt').value||10,t=$('qtype').value;
  let kinds=t==='mix'?TYPES:[t];
  let p='請只輸出一段合法 JSON,不要加任何說明文字或 Markdown。格式:\n';
  p+='{"title":"科目+範圍","questions":[題目物件,...]}\n\n題目物件格式:\n';
  kinds.forEach(k=>p+=SCHEMA[k]+'\n');
  p+='\n規則:\n'+kinds.map(k=>'- '+RULE[k]).join('\n');
  if(t==='mix')p+='\n- 每題都必須有 type,只可用 mcq、fill、proof,三種題型數量盡量平均。';
  else p+='\n- 每題都必須有 "type":"'+t+'"。';
  p+='\n- 所有題目的 exp 要寫解釋及解題方法,errorType 要寫常見錯誤類型。\n\n';
  p+='年級:'+g+' 範圍:'+sc+' 題數:'+n;
  return p;
}
async function copyPrompt(){
  const t=buildPrompt();
  try{await navigator.clipboard.writeText(t);$('pmsg').className='ok';$('pmsg').textContent='已複製,請到 Gemini 長按貼上。'}
  catch(e){
    $('pmsg').className='err';
    $('pmsg').textContent='自動複製失敗,請手動拷貝以下內容:\n\n'+t;
  }
}

/* ---------- 讀取 JSON ---------- */
async function pasteClip(){
  try{$('src').value=await navigator.clipboard.readText();setMsg('已貼上',true)}
  catch(e){setMsg('此瀏覽器不允許自動貼上,請長按文字框選「貼上」。',false)}
}

function parseInput(raw){
  let t=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  t=t.replace(/[\u201c\u201d]/g,'"');
  let data;
  try{data=JSON.parse(t)}catch(e){
    return {error:'JSON 讀取失敗:'+e.message+'\n請把這段訊息連同題目貼回給 AI,請它重新輸出。'}
  }
  let list=Array.isArray(data)?data:data.questions;
  title=(!Array.isArray(data)&&data.title)||'測驗';
  if(!Array.isArray(list))return {error:'找不到題目清單(需要 questions 陣列)。'};
  const good=[],bad=[];
  function ansIdx(a,len){
    if(typeof a==='string'&&/^[A-Fa-f]$/.test(a.trim()))a=L.indexOf(a.trim().toUpperCase());
    if(typeof a==='string'&&/^\d+$/.test(a.trim()))a=Number(a);
    return (Number.isInteger(a)&&a>=0&&a<len)?a:-1;
  }
  list.forEach((o,i)=>{
    const n=i+1;
    if(!o||typeof o.q!=='string'||!o.q.trim())return bad.push('第'+n+'題:缺少 q(題目)');
    const type=o.type?String(o.type).toLowerCase():'mcq';
    if(!TYPES.includes(type))return bad.push('第'+n+'題:type 不正確(只可用 mcq、fill、proof)');
    const base={type,q:o.q,exp:String(o.exp||''),subject:o.subject||'',topic:o.topic||'',errorType:o.errorType||''};
    if(type==='mcq'||type==='proof'){
      if(!Array.isArray(o.options)||o.options.length<2||o.options.length>6)return bad.push('第'+n+'題:options 需要 2 至 6 個選項');
      const a=ansIdx(o.answer,o.options.length);
      if(a<0)return bad.push('第'+n+'題:answer 不正確(應為 0 起算的數字,如 0 代表 A)');
      base.options=o.options.map(String);base.answer=a;
      if(type==='proof'){
        if(!Array.isArray(o.words)||o.words.length<2)return bad.push('第'+n+'題:proof 需要 words 陣列');
        const e=Number(o.errorIndex);
        if(!Number.isInteger(e)||e<0||e>=o.words.length)return bad.push('第'+n+'題:errorIndex 不正確');
        base.words=o.words.map(String);base.errorIndex=e;
      }
    }else{
      let a=o.answer;
      if(typeof a==='string'||typeof a==='number')a=[String(a)];
      if(!Array.isArray(a)||!a.length||a.some(x=>!String(x).trim()))return bad.push('第'+n+'題:fill 需要 answer(文字或陣列)');
      base.answer=a.map(String);
    }
    good.push(base);
  });
  return {good,bad,total:list.length};
}

function startFromInput(){
  const r=parseInput($('src').value);
  if(r.error)return setMsg(r.error,false);
  if(!r.good.length)return setMsg('沒有可用題目:\n'+r.bad.join('\n'),false);
  all=r.good;
  let m='成功讀取 '+r.good.length+' 題';
  if(r.bad.length)m+=',失敗 '+r.bad.length+' 題:\n'+r.bad.join('\n')+'\n(其餘題目仍會開始)';
  setMsg(m,!r.bad.length);
  begin(all);
}

function begin(list){qs=list;idx=0;score=0;wrongs=[];show('quiz');load()}

/* ---------- 出題 ---------- */
function load(){
  const q=qs[idx];
  selW=null;selO=null;locked=false;
  $('prog').textContent='進度 '+(idx+1)+' / '+qs.length;
  $('sc').textContent='得分 '+score;
  $('qtext').textContent=q.type==='proof'?'找出句子中的錯字,並揀出正確寫法:':q.q;
  $('tags').innerHTML='';
  [q.subject,q.topic].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;$('tags').appendChild(s)});
  $('exp').style.display='none';$('next').classList.add('hide');
  const c=$('area');c.innerHTML='';
  if(q.type==='mcq')renderMcq(c,q);
  else if(q.type==='fill')renderFill(c,q);
  else renderProof(c,q);
}

function renderMcq(c,q){
  q.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=L[i]+') '+o;
    b.onclick=()=>{
      if(locked)return;
      const bs=c.querySelectorAll('.opt');
      bs[q.answer].classList.add('correct');
      const ok=i===q.answer;
      if(!ok)bs[i].classList.add('wrong');
      done(ok,L[i]+') '+q.options[i]);
    };
    c.appendChild(b);
  });
}

function renderFill(c,q){
  const inp=document.createElement('input');
  inp.type='text';inp.id='fin';inp.placeholder='輸入答案';
  inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');
  const b=document.createElement('button');b.className='green';b.textContent='提交';
  const go=()=>{
    if(locked)return;
    const v=inp.value;
    if(!v.trim())return;
    const ok=q.answer.some(a=>norm(a)===norm(v));
    inp.disabled=true;b.disabled=true;
    inp.style.background=ok?'#d4edda':'#f8d7da';
    done(ok,v.trim());
  };
  b.onclick=go;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  c.appendChild(inp);c.appendChild(b);
}

function renderProof(c,q){
  const s1=document.createElement('div');s1.className='step';s1.textContent='第 1 步:點選有錯的字';
  const wd=document.createElement('div');wd.className='words';
  q.words.forEach((w,i)=>{
    const b=document.createElement('button');b.className='w';b.textContent=w;
    b.onclick=()=>{
      if(locked)return;
      selW=i;wd.querySelectorAll('.w').forEach((x,j)=>x.classList.toggle('sel',j===i));
      upd();
    };
    wd.appendChild(b);
  });
  const s2=document.createElement('div');s2.className='step';s2.textContent='第 2 步:揀正確寫法';
  const od=document.createElement('div');
  q.options.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=L[i]+') '+o;
    b.onclick=()=>{
      if(locked)return;
      selO=i;od.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('sel',j===i));
      upd();
    };
    od.appendChild(b);
  });
  const sub=document.createElement('button');sub.className='green';sub.textContent='提交';sub.disabled=true;
  function upd(){sub.disabled=(selW===null||selO===null)}
  sub.onclick=()=>{
    if(locked||selW===null||selO===null)return;
    const wOk=selW===q.errorIndex,oOk=selO===q.answer;
    const ws=wd.querySelectorAll('.w'),os=od.querySelectorAll('.opt');
    ws.forEach(x=>x.classList.remove('sel'));os.forEach(x=>x.classList.remove('sel'));
    ws[q.errorIndex].classList.add('correct');
    if(!wOk)ws[selW].classList.add('wrong');
    os[q.answer].classList.add('correct');
    if(!oOk)os[selO].classList.add('wrong');
    sub.disabled=true;
    done(wOk&&oOk,'錯字:'+q.words[selW]+';寫法:'+L[selO]+') '+q.options[selO]);
  };
  c.appendChild(s1);c.appendChild(wd);c.appendChild(s2);c.appendChild(od);c.appendChild(sub);
}

function ansText(q){
  if(q.type==='mcq')return L[q.answer]+') '+q.options[q.answer];
  if(q.type==='fill')return q.answer.join(' / ');
  return '錯字:'+q.words[q.errorIndex]+';正確寫法:'+L[q.answer]+') '+q.options[q.answer];
}

function done(ok,given){
  locked=true;
  const q=qs[idx];
  if(ok)score++;else wrongs.push({q,given});
  $('sc').textContent='得分 '+score;
  let t=(ok?'✅ 答對!\n':'❌ 答錯。正確答案:'+ansText(q)+'\n');
  if(q.type==='proof')t+='正確句子:'+q.q.replace(q.words[q.errorIndex],q.options[q.answer])+'\n';
  t+='\n💡 解釋:\n'+(q.exp||'(沒有提供解釋)');
  $('exp').textContent=t;
  $('exp').style.display='block';
  $('next').textContent=idx===qs.length-1?'查看結果 ➔':'下一題 ➔';
  $('next').classList.remove('hide');
}

function next(){idx++;idx<qs.length?load():finish()}

function finish(){
  show('result');
  $('final').textContent=score+' / '+qs.length;
  $('retryBtn').classList.toggle('hide',!wrongs.length);
  const st={};
  wrongs.forEach(w=>{const k=w.q.topic||w.q.subject||'未分類';st[k]=(st[k]||0)+1});
  $('stats').innerHTML=wrongs.length?'<p>錯題分佈:'+Object.entries(st).map(([k,v])=>esc(k)+' ×'+v).join('、')+'</p>':'<p>全部答對 🎉</p>';
  $('report').textContent=buildReport();
  try{
    const h=JSON.parse(localStorage.getItem('quizHist')||'[]');
    h.push({d:new Date().toLocaleString('zh-HK'),t:title,s:score,n:qs.length});
    localStorage.setItem('quizHist',JSON.stringify(h.slice(-30)));
  }catch(e){}
}

function buildReport(){
  let t='【測驗報告】'+title+'\n得分:'+score+'/'+qs.length+'\n';
  if(!wrongs.length)return t+'全部答對。';
  t+='錯題 '+wrongs.length+' 題:\n\n';
  const nm={mcq:'選擇題',fill:'填充題',proof:'Proofreading'};
  wrongs.forEach((w,i)=>{
    const q=w.q;
    t+=(i+1)+'. ['+nm[q.type]+'] '+q.q+'\n';
    if(q.options)q.options.forEach((o,j)=>t+='   '+L[j]+') '+o+'\n');
    t+='   孩子作答:'+w.given+'\n   正確答案:'+ansText(q)+'\n';
    const tg=[q.subject,q.topic,q.errorType].filter(Boolean).join(' / ');
    if(tg)t+='   標籤:'+tg+'\n';
    t+='\n';
  });
  t+='請根據以上錯題分析錯誤原因,並出同類變化題。';
  return t;
}

async function copyReport(){
  const t=buildReport();
  try{await navigator.clipboard.writeText(t);$('copymsg').textContent='已複製,可貼給 AI。'}
  catch(e){
    const r=document.createRange();r.selectNodeContents($('report'));
    const s=getSelection();s.removeAllRanges();s.addRange(r);
    $('copymsg').textContent='自動複製失敗,已選取下方文字,請手動拷貝。';
  }
}

function retryWrong(){begin(wrongs.map(w=>w.q))}

function fillSample(){
  $('src').value=JSON.stringify({title:'範例(三種題型)',questions:[
    {type:'mcq',subject:'常識',topic:'地理',q:'香港最高的山是哪一座?',options:['大帽山','太平山','獅子山','黃嶺'],answer:0,exp:'大帽山海拔約 957 米。',errorType:'記憶'},
    {type:'fill',subject:'英文',topic:'Tenses',q:'She ___ to school every day.',answer:['goes'],exp:'主語 She 是第三人稱單數,用 goes。',errorType:'主謂一致'},
    {type:'proof',subject:'English',topic:'Grammar',q:'She go to school every day.',words:['She','go','to','school','every','day.'],errorIndex:1,options:['goes','going','went','gone'],answer:0,exp:'主語 She 是第三人稱單數,動詞要加 es。',errorType:'主謂一致'}
  ]},null,1);
}

try{
  const h=JSON.parse(localStorage.getItem('quizHist')||'[]').slice(-5).reverse();
  if(h.length)$('hist').innerHTML='<p>最近紀錄:</p>'+h.map(x=>'<div>'+esc(x.d)+' ｜ '+esc(x.t)+' ｜ '+x.s+'/'+x.n+'</div>').join('');
}catch(e){}
</script>
</body>
</html>
