<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>互動測驗平台</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang HK",sans-serif;background:#f4f7f6;color:#333;max-width:800px;margin:0 auto;padding:16px;line-height:1.6;font-size:18px}
h1{text-align:center;color:#2c3e50;font-size:24px}
.box{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:monospace}
button{font-size:18px;border:none;border-radius:10px;padding:14px 20px;background:#3498db;color:#fff;cursor:pointer;margin:6px 6px 0 0}
button.gray{background:#7f8c8d}
button.green{background:#27ae60}
.opt{display:block;width:100%;text-align:left;background:#ecf0f1;color:#222;margin:0 0 10px;padding:16px;min-height:56px;border:2px solid transparent}
.opt.correct{background:#d4edda;border-color:#28a745}
.opt.wrong{background:#f8d7da;border-color:#dc3545}
.q{font-weight:bold;white-space:pre-wrap;margin-bottom:16px}
.exp{display:none;margin-top:14px;padding:14px;background:#e8f4f8;border-left:5px solid #17a2b8;border-radius:4px;white-space:pre-wrap}
.bar{display:flex;justify-content:space-between;color:#7f8c8d;font-weight:bold;margin-bottom:12px}
.err{color:#c0392b;white-space:pre-wrap;font-size:15px;margin-top:10px}
.ok{color:#27ae60;font-size:15px;margin-top:10px}
.tag{display:inline-block;background:#eef;color:#446;border-radius:6px;padding:2px 8px;font-size:13px;margin-right:4px}
.big{font-size:48px;color:#2ecc71;font-weight:bold;text-align:center}
pre{white-space:pre-wrap;background:#f8f9fa;padding:10px;border-radius:8px;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<h1>📝 互動測驗平台</h1>

<div id="setup" class="box">
  <p>把 AI 輸出的 JSON 貼在下面:</p>
  <textarea id="src" placeholder="在此貼上題目 JSON"></textarea>
  <button onclick="pasteClip()">📋 貼上</button>
  <button class="green" onclick="startFromInput()">🚀 開始測驗</button>
  <button class="gray" onclick="fillSample()">範例題</button>
  <div id="msg"></div>
  <div id="hist"></div>
</div>

<div id="quiz" class="box hide">
  <div class="bar"><span id="prog"></span><span id="sc"></span></div>
  <div id="tags"></div>
  <div class="q" id="qtext"></div>
  <div id="opts"></div>
  <div class="exp" id="exp"></div>
  <button id="next" class="hide" onclick="next()">下一題 ➔</button>
</div>

<div id="result" class="box hide">
  <div class="big" id="final"></div>
  <div id="stats"></div>
  <button class="green" onclick="copyReport()">📤 複製錯題報告</button>
  <button id="retryBtn" onclick="retryWrong()">🔁 只重做錯題</button>
  <button class="gray" onclick="location.reload()">新測驗</button>
  <div id="copymsg" class="ok"></div>
  <pre id="report"></pre>
</div>

<script>
const $=id=>document.getElementById(id);
const L=['A','B','C','D','E','F'];
let all=[],qs=[],idx=0,score=0,wrongs=[],title='測驗';

function show(id){['setup','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function setMsg(t,ok){$('msg').className=ok?'ok':'err';$('msg').textContent=t}

async function pasteClip(){
  try{$('src').value=await navigator.clipboard.readText();setMsg('已貼上',true)}
  catch(e){setMsg('此瀏覽器不允許自動貼上,請長按文字框選「貼上」。',false)}
}

function parseInput(raw){
  let t=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  t=t.replace(/[\u201c\u201d]/g,'"');
  let data;
  try{data=JSON.parse(t)}catch(e){
    return {error:'JSON 讀取失敗:'+e.message+'\n請把這段訊息連同題目貼回給 AI,請它重新輸出。'}
  }
  let list=Array.isArray(data)?data:data.questions;
  title=(!Array.isArray(data)&&data.title)||'測驗';
  if(!Array.isArray(list))return {error:'找不到題目清單(需要 questions 陣列)。'};
  const good=[],bad=[];
  list.forEach((o,i)=>{
    const n=i+1;
    if(!o||typeof o.q!=='string'||!o.q.trim())return bad.push('第'+n+'題:缺少 q(題目)');
    if(!Array.isArray(o.options)||o.options.length<2||o.options.length>6)return bad.push('第'+n+'題:options 需要 2 至 6 個選項');
    let a=o.answer;
    if(typeof a==='string'&&/^[A-Fa-f]$/.test(a.trim()))a=L.indexOf(a.trim().toUpperCase());
    if(typeof a==='string'&&/^\d+$/.test(a.trim()))a=Number(a);
    if(!Number.isInteger(a)||a<0||a>=o.options.length)return bad.push('第'+n+'題:answer 不正確(應為 0 起算的數字,如 0 代表 A)');
    good.push({q:o.q,options:o.options.map(String),answer:a,exp:String(o.exp||''),
      subject:o.subject||'',topic:o.topic||'',errorType:o.errorType||''});
  });
  return {good,bad,total:list.length};
}

function startFromInput(){
  const r=parseInput($('src').value);
  if(r.error)return setMsg(r.error,false);
  if(!r.good.length)return setMsg('沒有可用題目:\n'+r.bad.join('\n'),false);
  all=r.good;
  let m='成功讀取 '+r.good.length+' 題';
  if(r.bad.length)m+=',失敗 '+r.bad.length+' 題:\n'+r.bad.join('\n')+'\n(其餘題目仍會開始)';
  setMsg(m,!r.bad.length);
  begin(all);
}

function begin(list){
  qs=list;idx=0;score=0;wrongs=[];show('quiz');load();
}

function load(){
  const q=qs[idx];
  $('prog').textContent='進度 '+(idx+1)+' / '+qs.length;
  $('sc').textContent='得分 '+score;
  $('qtext').textContent=q.q;
  $('tags').innerHTML='';
  [q.subject,q.topic].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;$('tags').appendChild(s)});
  $('exp').style.display='none';$('next').classList.add('hide');
  const c=$('opts');c.innerHTML='';
  q.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=L[i]+') '+o;
    b.onclick=()=>pick(i);
    c.appendChild(b);
  });
}

function pick(i){
  const q=qs[idx],bs=document.querySelectorAll('.opt');
  bs.forEach(b=>b.disabled=true);
  bs[q.answer].classList.add('correct');
  if(i===q.answer)score++;
  else{bs[i].classList.add('wrong');wrongs.push({q,chosen:i})}
  $('sc').textContent='得分 '+score;
  $('exp').textContent='💡 解釋:\n'+(q.exp||'(沒有提供解釋)');
  $('exp').style.display='block';
  $('next').textContent=idx===qs.length-1?'查看結果 ➔':'下一題 ➔';
  $('next').classList.remove('hide');
}

function next(){idx++;idx<qs.length?load():finish()}

function finish(){
  show('result');
  $('final').textContent=score+' / '+qs.length;
  $('retryBtn').classList.toggle('hide',!wrongs.length);
  const st={};
  wrongs.forEach(w=>{const k=w.q.topic||w.q.subject||'未分類';st[k]=(st[k]||0)+1});
  $('stats').innerHTML=wrongs.length?'<p>錯題分佈:'+Object.entries(st).map(([k,v])=>esc(k)+' ×'+v).join('、')+'</p>':'<p>全部答對 🎉</p>';
  $('report').textContent=buildReport();
  try{
    const h=JSON.parse(localStorage.getItem('quizHist')||'[]');
    h.push({d:new Date().toLocaleString('zh-HK'),t:title,s:score,n:qs.length});
    localStorage.setItem('quizHist',JSON.stringify(h.slice(-30)));
  }catch(e){}
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function buildReport(){
  let t='【測驗報告】'+title+'\n得分:'+score+'/'+qs.length+'\n';
  if(!wrongs.length)return t+'全部答對。';
  t+='錯題 '+wrongs.length+' 題:\n\n';
  wrongs.forEach((w,i)=>{
    const q=w.q;
    t+=(i+1)+'. '+q.q+'\n';
    q.options.forEach((o,j)=>t+='   '+L[j]+') '+o+'\n');
    t+='   孩子選擇:'+L[w.chosen]+'\n   正確答案:'+L[q.answer]+'\n';
    const tg=[q.subject,q.topic,q.errorType].filter(Boolean).join(' / ');
    if(tg)t+='   標籤:'+tg+'\n';
    t+='\n';
  });
  t+='請根據以上錯題分析錯誤原因,並出同類變化題。';
  return t;
}

async function copyReport(){
  const t=buildReport();
  try{await navigator.clipboard.writeText(t);$('copymsg').textContent='已複製,可貼給 AI。'}
  catch(e){
    const r=document.createRange();r.selectNodeContents($('report'));
    const s=getSelection();s.removeAllRanges();s.addRange(r);
    $('copymsg').textContent='自動複製失敗,已選取下方文字,請手動拷貝。';
  }
}

function retryWrong(){begin(wrongs.map(w=>w.q))}

function fillSample(){
  $('src').value=JSON.stringify({title:'範例',questions:[
    {subject:'常識',topic:'地理',q:'香港最高的山是哪一座?',options:['大帽山','太平山','獅子山'],answer:0,exp:'大帽山海拔約 957 米。',errorType:'記憶'},
    {subject:'英文',topic:'Tenses',q:'She ____ to school every day.',options:['go','goes','going','gone'],answer:1,exp:'主語 She 是第三人稱單數,用 goes。',errorType:'語法'}
  ]},null,1);
}

try{
  const h=JSON.parse(localStorage.getItem('quizHist')||'[]').slice(-5).reverse();
  if(h.length)$('hist').innerHTML='<p>最近紀錄:</p>'+h.map(x=>'<div>'+esc(x.d)+' ｜ '+esc(x.t)+' ｜ '+x.s+'/'+x.n+'</div>').join('');
}catch(e){}
</script>
</body>
</html>
